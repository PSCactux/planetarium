<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A web planetarium with a telescope eyepiece simulator: real sky, Milky Way, deep-sky objects and real telescope models." />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23081020'/%3E%3Cpath d='M16 6l2.4 7.2H26l-6.1 4.5 2.3 7.3L16 20.5 9.8 25l2.3-7.3L6 13.2h7.6z' fill='%23ffe7a0'/%3E%3C/svg%3E" />
    <title>Planetarium</title>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M11 6 4 12l7 6V6Zm9 0-7 6 7 6V6Z" fill="currentColor"/></symbol>
      <symbol id="i-fwd" viewBox="0 0 24 24"><path d="m13 6 7 6-7 6V6ZM4 6l7 6-7 6V6Z" fill="currentColor"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7L7 5Z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></symbol>
      <symbol id="i-scope" viewBox="0 0 24 24"><path d="m3 14 13.5-7.2 1.9 3.6L4.9 17.6 3 14Zm15-8.4 1.8-1 2.2 4.2-1.8 1M10 15.5 7.5 21M12 15l2.5 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-sky" viewBox="0 0 24 24"><path d="M12 3.5l1.6 4.2 4.4.2-3.4 2.8 1.2 4.3L12 12.6 8.2 15l1.2-4.3L6 7.9l4.4-.2L12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="19" cy="4.5" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M2.5 9a6 6 0 0 1 2-4M21.5 9a6 6 0 0 0-2-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-moonset" viewBox="0 0 24 24"><path d="M15 4a7 7 0 1 0 5 12.2A8 8 0 0 1 15 4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 1 1 12 0c0 5.4-6 11-6 11Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.2" fill="currentColor"/></symbol>
    </svg>

    <div id="app">
      <canvas id="gl"></canvas>
      <canvas id="overlay"></canvas>

      <header class="hud">
        <div class="brand" data-i18n="app.title">Planetarium</div>
        <div id="clock" class="clock">
          <span><span id="clock-local"></span> <span class="clock-note" data-i18n="clock.browser">(browser time)</span></span>
          <span id="clock-utc" class="clock-utc"></span>
          <span id="clock-place"></span>
        </div>
      </header>

      <div id="search-backdrop" class="search-backdrop"></div>
      <div class="top-actions">
        <div id="search" class="search">
          <input id="search-input" type="search" placeholder="Search: Jupiter, M31, Vega…" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria" autocomplete="off" spellcheck="false" aria-label="Search the sky" aria-controls="search-results" />
          <button id="search-cancel" class="search-cancel" type="button" data-i18n="search.cancel">Cancel</button>
          <ul id="search-results" class="search-results" role="listbox"></ul>
        </div>
        <button id="search-toggle" class="icon-btn" aria-label="Search (/)" title="Search (/)" data-i18n-title="top.search" data-i18n-aria="top.search" aria-expanded="false"><svg><use href="#i-search"/></svg></button>
        <button id="guide-toggle" class="icon-btn" aria-label="Quick guide" title="Quick guide" data-i18n-title="top.guide" data-i18n-aria="top.guide"><svg><use href="#i-help"/></svg></button>
        <button id="panel-toggle" class="icon-btn" aria-controls="panel" aria-label="Settings" title="Settings" data-i18n-title="top.settings" data-i18n-aria="top.settings"><svg><use href="#i-sliders"/></svg></button>
      </div>

      <div id="day-hint" class="day-hint" hidden>
        <span data-i18n="day.hint">Daylight hides the stars.</span>
        <button id="tonight" data-i18n="day.tonight">See tonight's sky</button>
      </div>

      <div class="timebar" role="toolbar" aria-label="Time controls" data-i18n-aria="time.controls">
        <button id="slower" class="icon-btn" title="Slower or backwards" aria-label="Slower or backwards" data-i18n-title="time.slower" data-i18n-aria="time.slower"><svg><use href="#i-back"/></svg></button>
        <button id="play" class="icon-btn" title="Play or pause (space)" aria-label="Play or pause" data-i18n-title="time.play" data-i18n-aria="time.play"><svg><use id="play-icon" href="#i-pause"/></svg></button>
        <button id="faster" class="icon-btn" title="Faster" aria-label="Faster" data-i18n-title="time.faster" data-i18n-aria="time.faster"><svg><use href="#i-fwd"/></svg></button>
        <span id="speed-label" class="speed"></span>
        <button id="now" title="Back to the current time" data-i18n-title="time.nowTitle" data-i18n="time.now">Now</button>
        <button id="scope-toggle" class="with-icon" title="Telescope view (T)" data-i18n-title="scope.buttonTitle"><svg><use href="#i-scope"/></svg><span data-i18n="scope.button">Telescope</span></button>
        <span id="scope-bar" class="scope-bar" hidden>
          <button id="scope-prev" title="Previous target ([)" aria-label="Previous target ([)" data-i18n-title="scope.prev" data-i18n-aria="scope.prev">‹</button>
          <select id="scope-target" aria-label="Telescope target" data-i18n-aria="scope.target"></select>
          <button id="scope-next" title="Next target (])" aria-label="Next target (])" data-i18n-title="scope.next" data-i18n-aria="scope.next">›</button>
        </span>
      </div>

      <section id="gear" class="gear" hidden aria-label="Telescope and eyepiece" data-i18n-aria="gear.aria">
        <div class="sheet-grip" id="gear-grip" aria-hidden="true"></div>
        <button id="gear-toggle" class="gear-head" aria-expanded="true" aria-controls="gear-body">
          <svg class="gear-icon"><use href="#i-scope"/></svg>
          <span class="gear-title"><strong id="gear-name"></strong><span id="gear-spec" class="gear-spec"></span></span>
          <span id="gear-mag" class="gear-mag"></span>
          <svg class="gear-chevron"><use href="#i-chevron"/></svg>
        </button>
        <div id="gear-quick" class="gear-quick"></div>
        <div id="gear-body" class="gear-body">
          <label class="gear-label" for="gear-model" data-i18n="gear.telescope">Telescope</label>
          <select id="gear-model"></select>
          <p id="gear-note" class="gear-note"></p>
          <div id="gear-custom" class="gear-custom" hidden>
            <label><span data-i18n="gear.aperture">Aperture</span> <output id="out-aperture"></output>
              <input id="rng-aperture" type="range" min="40" max="400" step="1" />
            </label>
            <label><span data-i18n="gear.focal">Focal length</span> <output id="out-focal"></output>
              <input id="rng-focal" type="range" min="200" max="3000" step="10" />
            </label>
            <label><span data-i18n="gear.design">Design</span> <select id="custom-design"></select></label>
          </div>
          <div id="gear-eyepiece-block">
            <span class="gear-label" data-i18n="gear.eyepiece">Eyepiece</span>
            <div id="gear-eyepieces" class="chips"></div>
            <span class="gear-label" data-i18n="gear.barlow">Barlow lens</span>
            <div id="gear-barlows" class="chips"></div>
          </div>
          <div id="gear-readouts" class="readouts"></div>
          <p id="gear-advice" class="gear-advice"></p>
        </div>
      </section>

      <aside id="panel" class="panel">
        <div class="sheet-grip" id="panel-grip" aria-hidden="true"></div>
        <div class="panel-head">
          <span data-i18n="top.settings">Settings</span>
          <button id="panel-close" class="close" aria-label="Close" data-i18n-aria="info.close">×</button>
        </div>
        <details open>
          <summary data-i18n="set.time">Date and time</summary>
          <label><span data-i18n="set.datetime">Date and time (your browser's time zone)</span>
            <input id="datetime" type="datetime-local" step="60" />
          </label>
          <label><span data-i18n="set.speed">Speed</span>
            <select id="speed"></select>
          </label>
        </details>

        <details open>
          <summary data-i18n="set.location">Location</summary>
          <label><span data-i18n="set.preset">Place</span> <select id="place"></select></label>
          <div class="row">
            <label><span data-i18n="set.lat">Latitude</span> <input id="lat" type="number" step="0.0001" min="-90" max="90" /></label>
            <label><span data-i18n="set.lon">Longitude</span> <input id="lon" type="number" step="0.0001" min="-180" max="180" /></label>
          </div>
          <button id="geolocate" class="wide with-icon"><svg><use href="#i-pin"/></svg><span data-i18n="set.geolocate">Use my location</span></button>
          <p id="geo-status" class="hint"></p>
          <label><span data-i18n="set.darkness">Sky darkness</span> <select id="sky-quality"></select></label>
        </details>

        <details open>
          <summary data-i18n="set.display">Display</summary>
          <label class="check"><input id="show-milkyway" type="checkbox" /> <span data-i18n="set.milkyway">Milky Way</span></label>
          <label class="check"><input id="show-deepsky" type="checkbox" /> <span data-i18n="set.deepsky">Galaxies, nebulae and clusters</span></label>
          <label class="check"><input id="show-lines" type="checkbox" /> <span data-i18n="set.lines">Constellation lines</span></label>
          <label class="check"><input id="show-cnames" type="checkbox" /> <span data-i18n="set.cnames">Constellation names</span></label>
          <label class="check"><input id="show-snames" type="checkbox" /> <span data-i18n="set.snames">Star names</span></label>
          <label class="check"><input id="show-atmosphere" type="checkbox" /> <span data-i18n="set.atmosphere">Atmosphere and daylight</span></label>
          <label class="check"><input id="show-ground" type="checkbox" /> <span data-i18n="set.ground">Ground</span></label>
        </details>

        <details open>
          <summary data-i18n="set.telescope">Telescope</summary>
          <label class="check"><input id="scope" type="checkbox" /> <span data-i18n="set.scope">Telescope view</span></label>
          <label class="check"><input id="real-orientation" type="checkbox" /> <span data-i18n="set.orientation">Show the image as the eyepiece does (rotated or mirrored)</span></label>
          <p class="hint" data-i18n="set.gearHint">Pick the telescope, eyepiece and Barlow in the equipment panel of the telescope view.</p>
        </details>

        <button id="guide-open" class="wide with-icon guide-open"><svg><use href="#i-help"/></svg><span data-i18n="top.guide">Quick guide</span></button>
        <label class="lang-row"><span data-i18n="set.language">Language</span> <select id="language"></select></label>
        <p class="hint" data-i18n="set.help"></p>
        <p class="hint credits" data-i18n="set.credits"></p>
      </aside>

      <div id="gyro-ui" class="gyro-ui" hidden>
        <button id="gyro-btn" class="gyro-btn" aria-pressed="false" data-i18n-aria="gyro.start" data-i18n-title="gyro.start" aria-label="Point your phone at the sky"><svg><use href="#i-phone"/></svg></button>
        <button id="gyro-pill" class="gyro-pill" hidden data-i18n="gyro.active">Following your phone · tap to stop</button>
      </div>

      <section id="timesheet" class="timesheet" hidden aria-labelledby="ts-title">
        <div class="sheet-grip" id="ts-grip" aria-hidden="true"></div>
        <div class="ts-head">
          <div>
            <p id="ts-title" class="ts-time"></p>
            <p id="ts-date" class="ts-date"></p>
          </div>
          <button id="ts-play" class="ts-play" data-i18n-aria="time.play" aria-label="Play or pause"><svg><use id="ts-play-icon" href="#i-pause"/></svg></button>
        </div>
        <div id="ts-jog" class="ts-jog" role="slider" tabindex="0" aria-valuemin="-24" aria-valuemax="24" aria-valuenow="0" data-i18n-aria="time.drag" aria-label="Drag to travel in time">
          <div class="ts-ticks"></div>
          <span class="ts-jog-label" data-i18n="time.drag">Drag to travel in time</span>
        </div>
        <div id="ts-speeds" class="ts-speeds"></div>
        <div class="ts-actions">
          <button id="ts-now" data-i18n="time.now">Now</button>
          <button id="ts-tonight" class="with-icon"><svg><use href="#i-moonset"/></svg><span data-i18n="day.tonight">See tonight's sky</span></button>
        </div>
      </section>

      <nav id="tabbar" class="tabbar" aria-label="Main">
        <button id="tab-sky" class="tab active" aria-pressed="true"><svg><use href="#i-sky"/></svg><span data-i18n="tab.sky">Sky</span></button>
        <button id="tab-search" class="tab" aria-pressed="false"><svg><use href="#i-search"/></svg><span data-i18n="tab.search">Search</span></button>
        <button id="tab-scope" class="tab tab-main" aria-pressed="false"><svg><use href="#i-scope"/></svg><span data-i18n="tab.scope">Telescope</span></button>
        <button id="tab-time" class="tab" aria-pressed="false"><svg><use href="#i-clock"/></svg><span data-i18n="tab.time">Time</span></button>
        <button id="tab-more" class="tab" aria-pressed="false"><svg><use href="#i-sliders"/></svg><span data-i18n="tab.more">Settings</span></button>
      </nav>

      <div id="info" class="info" hidden>
        <div class="sheet-grip" id="info-grip" aria-hidden="true"></div>
        <button id="info-close" class="close" title="Close" aria-label="Close" data-i18n-title="info.close" data-i18n-aria="info.close">×</button>
        <h2 id="info-title"></h2>
        <p id="info-sub" class="sub"></p>
        <table id="info-table" class="stats"></table>
        <div class="actions">
          <button id="info-center" data-i18n="info.center">Center</button>
          <button id="info-scope" class="with-icon"><svg><use href="#i-scope"/></svg><span data-i18n="info.observe">Observe</span></button>
          <label class="check"><input id="info-track" type="checkbox" /> <span data-i18n="info.track">Track</span></label>
          <button id="info-more" class="info-more" aria-expanded="false" data-i18n="info.more">Details</button>
        </div>
      </div>

      <div id="loading" class="loading"><div class="loading-ring"></div><span data-i18n="app.loading">Loading the sky…</span></div>

      <div id="guide" class="guide" hidden>
        <div class="guide-spot"></div>
        <div class="guide-card" role="dialog" aria-modal="false" aria-labelledby="guide-title">
          <p class="guide-step"></p>
          <h2 id="guide-title"></h2>
          <p class="guide-text"></p>
          <div class="guide-langs"></div>
          <div class="guide-actions">
            <button class="guide-skip"></button>
            <span class="guide-dots"></span>
            <button class="guide-back"></button>
            <button class="guide-next"></button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
